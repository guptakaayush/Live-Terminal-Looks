<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terminal Editor</title>

<style>
    body {
        margin: 0;
        background: black;
        color: white;
        font-family: monospace;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    .container {
        width: 90%;
        max-width: 900px;
        margin-top: 40px;
    }

    .prompt {
        font-size: 18px;
        margin-bottom: 10px;
    }

    .green {
        color: #00ff00;
    }

    .blue {
        color: #4da6ff;
    }

    .editor {
        border: 2px solid white;
        padding: 30px;
        min-height: 400px;
        outline: none;
        white-space: pre-wrap;
        caret-color: white;
        font-size: 16px;
    }
</style>
</head>

<body>
<div class="container">

    <!-- Prompt -->
    <div class="prompt">
        <h1>Example:</h1>
        <span class="green">ryota@Aarjan</span>:<span class="blue">~</span>$ nano P3.asm
    </div>

    <!-- Editable Editor -->
     <h1>Text Editor:</h1>
    <div class="editor" contenteditable="true" spellcheck="false"></div>


</div>

<script>
const editor = document.querySelector('.editor');

function saveCaretPosition(context) {
    const selection = window.getSelection();
    if (selection.rangeCount === 0) return null;

    const range = selection.getRangeAt(0);
    const preRange = range.cloneRange();
    preRange.selectNodeContents(context);
    preRange.setEnd(range.endContainer, range.endOffset);

    return preRange.toString().length;
}

function restoreCaretPosition(context, pos) {
    if (pos === null) return;

    const selection = window.getSelection();
    let currentPos = 0;
    const walker = document.createTreeWalker(
        context,
        NodeFilter.SHOW_TEXT,
        null,
        null
    );

    let node;
    while ((node = walker.nextNode())) {
        const nextPos = currentPos + node.length;
        if (pos <= nextPos) {
            const range = document.createRange();
            range.setStart(node, pos - currentPos);
            range.collapse(true);
            selection.removeAllRanges();
            selection.addRange(range);
            return;
        }
        currentPos = nextPos;
    }
}

function highlightText() {
    const caretPos = saveCaretPosition(editor);

    let text = editor.innerText
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    // Highlight user@host in green
    text = text.replace(/(\w+@\w+)/g, '<span class="green">$1</span>');

    // Highlight ~ in blue
    text = text.replace(/~/g, '<span class="blue">~</span>');

    editor.innerHTML = text;
    restoreCaretPosition(editor, caretPos);
}

editor.addEventListener('input', highlightText);
</script>


</body>
</html>
